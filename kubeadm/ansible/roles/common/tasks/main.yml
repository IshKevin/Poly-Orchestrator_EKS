---
# Runs on every node: disable swap, install containerd, install kubeadm/kubelet/kubectl

- name: Disable swap immediately
  command: swapoff -a
  changed_when: false

- name: Remove swap entries from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Persist required kernel modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Load overlay module
  modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  modprobe:
    name: br_netfilter
    state: present

- name: Configure sysctl for Kubernetes networking
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables",  value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward",                 value: "1" }

- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - gpg
      - software-properties-common
      - lsb-release
    state: present
    update_cache: true

# ── containerd ────────────────────────────────────────────────────────────────

- name: Add Docker GPG key for containerd repo
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Add Docker apt repository (containerd source)
  apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install containerd.io
  apt:
    name: containerd.io
    state: present
    update_cache: true

- name: Generate default containerd config
  shell: containerd config default > /etc/containerd/config.toml
  changed_when: true
  notify: Restart containerd

- name: Enable SystemdCgroup in containerd config
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Flush handlers to restart containerd before kubeadm
  meta: flush_handlers

- name: Ensure containerd is enabled and running
  systemd:
    name: containerd
    enabled: true
    state: started

# ── Kubernetes packages ───────────────────────────────────────────────────────

- name: Create Kubernetes apt keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Kubernetes GPG key
  get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: "0644"
    force: true

- name: Dearmor and install Kubernetes GPG key
  shell: >
    gpg --dearmor < /tmp/kubernetes-release.key
    > /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes apt repository
  copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /

- name: Install kubeadm, kubelet, kubectl
  apt:
    name:
      - "kubeadm"
      - "kubelet"
      - "kubectl"
    state: present
    update_cache: true

- name: Hold Kubernetes packages at current version
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet
    - kubectl

- name: Enable and start kubelet
  systemd:
    name: kubelet
    enabled: true
    state: started
