---
# Runs on the control-plane node as the ubuntu user (become: false in site.yml).
# Installs Helm, Gateway API CRDs, nginx-gateway-fabric (NodePort 30080), and metrics-server.

- name: Download Helm installer
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3.sh
    mode: "0755"

- name: Install Helm
  command: /tmp/get-helm-3.sh
  args:
    creates: /usr/local/bin/helm
  become: true

- name: Install Gateway API CRDs (standard channel)
  command: >
    kubectl apply -f
    https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

- name: Write nginx-gateway-fabric Helm values
  copy:
    dest: /tmp/ngf-values.yaml
    content: |
      service:
        type: NodePort
        ports:
          - port: 80
            targetPort: 80
            protocol: TCP
            name: http
            nodePort: 30080

- name: Install nginx-gateway-fabric (NodePort 30080, Gateway API controller)
  command: >
    helm upgrade --install ngf
    oci://ghcr.io/nginxinc/charts/nginx-gateway-fabric
    --namespace nginx-gateway --create-namespace
    --version {{ nginx_gf_version }}
    --values /tmp/ngf-values.yaml
    --wait --timeout=5m
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Install metrics-server
  command: >
    kubectl apply -f
    https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig }}"

- name: Patch metrics-server to disable TLS verification (self-signed cert in kubeadm)
  command: >
    kubectl patch deployment metrics-server
    -n kube-system
    --type=json
    -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: patch_result
  changed_when: patch_result.rc == 0

- name: Wait for nginx-gateway-fabric controller to be ready
  command: >
    kubectl rollout status deployment/ngf-nginx-gateway-fabric
    -n nginx-gateway --timeout=300s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
