# Gateway API routing for kubeadm (EC2) — replaces the old Ingress resource.
#
# Controller: nginx-gateway-fabric (installed by Ansible cluster-addons role).
# The Ansible role also installs the Gateway API CRDs and creates the GatewayClass.
# The GatewayClass is included here for reference and idempotent apply.
#
# Traffic path:
#   Internet → NLB :80 → worker NodePort 30080 → nginx-gateway-fabric → HTTPRoute rules

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nginx
spec:
  controllerName: gateway.nginx.org/nginx-gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopnow-gateway
  namespace: shopnow
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shopnow
  namespace: shopnow
spec:
  parentRefs:
    - name: shopnow-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 5000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
