# Gateway API routing for local (Minikube) — replaces the old Ingress resource.
#
# Controller: nginx-gateway-fabric
# Install it before applying this file:
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
#   helm install ngf oci://ghcr.io/nginxinc/charts/nginx-gateway-fabric \
#     --namespace nginx-gateway --create-namespace --version 1.4.0
#
# Then enable Minikube tunnel so the Gateway gets an external IP:
#   minikube tunnel

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nginx
spec:
  controllerName: gateway.nginx.org/nginx-gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopnow-gateway
  namespace: shopnow
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shopnow
  namespace: shopnow
spec:
  parentRefs:
    - name: shopnow-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 5000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
