apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: shopnow
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: shopnow
            - name: POSTGRES_USER
              value: shopnow
            - name: POSTGRES_PASSWORD
              value: shopnow123
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "shopnow", "-d", "shopnow"]
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shopnow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
