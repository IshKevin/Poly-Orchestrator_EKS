# Gateway API routing for EKS (production).
#
# Controller: nginx-gateway-fabric (installed via Helm in initial-deploy.sh).
# Traffic path: Internet → AWS NLB (auto-provisioned for LoadBalancer svc) → nginx-gateway-fabric → pods.
#
# Verification after apply (wait ~2 min for NLB to provision):
#   kubectl get gateway shopnow-gateway -n shopnow
#   kubectl get httproute shopnow -n shopnow

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nginx
spec:
  controllerName: gateway.nginx.org/nginx-gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopnow-gateway
  namespace: shopnow
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shopnow
  namespace: shopnow
spec:
  parentRefs:
    - name: shopnow-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 5000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 3000
