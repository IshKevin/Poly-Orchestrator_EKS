# WARNING: This is a plain Kubernetes Secret (base64-encoded, NOT encrypted at rest
# unless your cluster has envelope encryption enabled on the etcd volume).
#
# FOR PRODUCTION, replace this file with one of these approaches:
#
#   Option A — AWS Secrets Manager + External Secrets Operator (ESO):
#     1. Store the password in AWS Secrets Manager.
#     2. Install ESO: https://external-secrets.io/latest/introduction/getting-started/
#     3. Create a SecretStore pointing at your AWS region.
#     4. Replace this file with an ExternalSecret manifest that syncs
#        the AWS secret into a Kubernetes Secret named "shopnow-secret".
#
#   Option B — AWS Secrets Manager + Secrets Store CSI Driver (ASCP):
#     1. Store the password in AWS Secrets Manager.
#     2. Install the Secrets Store CSI Driver + AWS provider.
#     3. Mount the secret as a volume or sync it to a Kubernetes Secret.
#
#   In either case the Secret name and key (DB_PASSWORD) remain the same so
#   the Deployment manifests do not need to change.
apiVersion: v1
kind: Secret
metadata:
  name: shopnow-secret
  namespace: shopnow
type: Opaque
data:
  # echo -n 'shopnow_password_change_me' | base64
  # Replace the value below with: echo -n 'YOUR_ACTUAL_PASSWORD' | base64
  DB_PASSWORD: c2hvcG5vd19wYXNzd29yZF9jaGFuZ2VfbWU=
