apiVersion: v1
kind: ConfigMap
metadata:
  name: shopnow-config
  namespace: shopnow
data:
  # DB_HOST and REDIS_HOST are set by initial-deploy.sh from Terraform outputs.
  # Update these values before running: kubectl apply -f k8s/configmap.yaml
  DB_HOST: "shopnow-dev-postgres.cgrauoqm4vgg.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "shopnow"
  DB_USER: "shopnow"
  REDIS_HOST: "shopnow-dev-redis.gd3q2q.0001.use1.cache.amazonaws.com"
  REDIS_PORT: "6379"
  # Frontend uses this to proxy API calls; it resolves via in-cluster DNS.
  BACKEND_URL: "http://backend:5000"
